<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow1" cx="20%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#0071e3" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="80%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#bf5af2" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#30d158" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Fill & Stroke -->
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Glowing Text Gradients -->
    <linearGradient id="textAppleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f5f5f7"/>
      <stop offset="70%" stop-color="#64d2ff"/>
      <stop offset="100%" stop-color="#bf5af2"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0071e3"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30d158"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff375f"/>
      <stop offset="100%" stop-color="#bf5af2"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0071e3" flood-opacity="0.25"/>
    </filter>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-sf {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }
  </style>

  <!-- Deep Obsidian Space Canvas -->
  <rect width="1200" height="540" fill="#08090d"/>
  <rect width="1200" height="540" fill="url(#bgGlow1)"/>
  <rect width="1200" height="540" fill="url(#bgGlow2)"/>
  <rect width="1200" height="540" fill="url(#bgGlow3)"/>

  <!-- Subtle Retina Grid Matrix -->
  <g opacity="0.10" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="150" y1="0" x2="150" y2="540" />
    <line x1="300" y1="0" x2="300" y2="540" />
    <line x1="450" y1="0" x2="450" y2="540" />
    <line x1="600" y1="0" x2="600" y2="540" />
    <line x1="750" y1="0" x2="750" y2="540" />
    <line x1="900" y1="0" x2="900" y2="540" />
    <line x1="1050" y1="0" x2="1050" y2="540" />
  </g>

  <!-- Floating Ambient Neon Glyphs in Background -->
  <text x="80" y="140" fill="#00f5ff" opacity="0.15" font-size="72" font-weight="900" class="font-sf" filter="url(#neonBlur)">42</text>
  <text x="1060" y="150" fill="#bf5af2" opacity="0.15" font-size="80" font-weight="900" class="font-sf" filter="url(#neonBlur)">∞</text>
  <text x="110" y="470" fill="#30d158" opacity="0.14" font-size="70" font-weight="900" class="font-sf" filter="url(#neonBlur)">π</text>
  <text x="1040" y="460" fill="#ff9f0a" opacity="0.14" font-size="64" font-weight="900" class="font-sf" filter="url(#neonBlur)">√2</text>

  <!-- Central Frosted Titanium Glass Stage -->
  <rect x="180" y="55" width="840" height="430" rx="32" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Top Apple Dynamic Island Pill -->
  <rect x="470" y="75" width="260" height="36" rx="18" fill="#000000" fill-opacity="0.65" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="495" cy="93" r="5" fill="#30d158" filter="url(#neonBlur)"/>
  <text x="512" y="98" fill="#f5f5f7" font-size="12" font-weight="600" letter-spacing="0.5" class="font-sf">APPLE FLUID MOTION • 8K</text>

  <!-- Hero Title -->
  <text x="600" y="170" text-anchor="middle" fill="url(#textAppleGlow)" font-size="52" font-weight="700" letter-spacing="-1.5" class="font-sf">
    Neon Number Games
  </text>
  <text x="600" y="208" text-anchor="middle" fill="#86868b" font-size="17" font-weight="400" letter-spacing="0.1" class="font-sf">
    Next-Gen Quantum Math &amp; Logic Arcade • Translucent Materials &amp; Tactile Synthesizer
  </text>

  <!-- 6 Game Mode Badges Grid (Apple Micro-Pills) -->
  <g transform="translate(230, 240)">
    <!-- Pill 1: Inspector -->
    <rect x="0" y="0" width="118" height="42" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <text x="59" y="26" text-anchor="middle" fill="#64d2ff" font-size="13" font-weight="600" class="font-sf">⚡ Inspector</text>

    <!-- Pill 2: Quantum Guess -->
    <rect x="130" y="0" width="118" height="42" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <text x="189" y="26" text-anchor="middle" fill="#30d158" font-size="13" font-weight="600" class="font-sf">🎯 Guess 1-100</text>

    <!-- Pill 3: Math Blitz -->
    <rect x="260" y="0" width="118" height="42" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <text x="319" y="26" text-anchor="middle" fill="#ffd60a" font-size="13" font-weight="600" class="font-sf">🧠 Math Blitz</text>

    <!-- Pill 4: High / Low -->
    <rect x="390" y="0" width="118" height="42" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <text x="449" y="26" text-anchor="middle" fill="#ff9f0a" font-size="13" font-weight="600" class="font-sf">↕️ High / Low</text>

    <!-- Pill 5: Prime Hunter -->
    <rect x="520" y="0" width="118" height="42" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <text x="579" y="26" text-anchor="middle" fill="#bf5af2" font-size="13" font-weight="600" class="font-sf">💎 Prime Rush</text>

    <!-- Pill 6: Pattern Master -->
    <rect x="650" y="0" width="118" height="42" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <text x="709" y="26" text-anchor="middle" fill="#ff375f" font-size="13" font-weight="600" class="font-sf">🧩 Sequences</text>
  </g>

  <!-- Interactive Gameplay Mockup Strip -->
  <g transform="translate(230, 305)">
    <rect x="0" y="0" width="740" height="95" rx="18" fill="#000000" fill-opacity="0.4" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    
    <!-- Mini Gauge Left -->
    <circle cx="55" cy="48" r="28" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="5"/>
    <circle cx="55" cy="48" r="28" fill="none" stroke="#30d158" stroke-width="5" stroke-dasharray="140" stroke-dashoffset="35" stroke-linecap="round"/>
    <text x="55" y="53" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700" class="font-sf">100%</text>

    <!-- Center Display -->
    <text x="120" y="42" fill="#ffffff" font-size="20" font-weight="600" class="font-sf">7 × 8 + 14 = ?</text>
    <text x="120" y="66" fill="#86868b" font-size="13" font-weight="400" class="font-sf">Combo Streak: <tspan fill="#ffd60a" font-weight="700">x12 🔥</tspan> • Speed bonus: <tspan fill="#30d158">+250 pts</tspan></text>

    <!-- Right Action Button (Apple Action Blue) -->
    <rect x="580" y="24" width="135" height="46" rx="23" fill="#0071e3"/>
    <text x="647" y="52" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600" class="font-sf">Solve [70]</text>
  </g>

  <!-- Bottom Platform Verified Tags -->
  <g transform="translate(260, 428)">
    <!-- Tag 1: YouTube Playables -->
    <rect x="0" y="0" width="200" height="34" rx="17" fill="#ff0000" fill-opacity="0.15" stroke="#ff0000" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="20" cy="17" r="5" fill="#ff0000"/>
    <text x="35" y="22" fill="#ffffff" font-size="12" font-weight="600" class="font-sf">YouTube Playables 100%</text>

    <!-- Tag 2: TypeSafe AI -->
    <rect x="220" y="0" width="210" height="34" rx="17" fill="#00e5ff" fill-opacity="0.15" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="240" cy="17" r="5" fill="#00e5ff"/>
    <text x="255" y="22" fill="#ffffff" font-size="12" font-weight="600" class="font-sf">TypeSafe System One Jev</text>

    <!-- Tag 3: Web Audio Synth -->
    <rect x="450" y="0" width="200" height="34" rx="17" fill="#bf5af2" fill-opacity="0.15" stroke="#bf5af2" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="470" cy="17" r="5" fill="#bf5af2"/>
    <text x="485" y="22" fill="#ffffff" font-size="12" font-weight="600" class="font-sf">Web Audio Procedural 8K</text>
  </g>

  <!-- Outer Glow Reflections -->
  <line x1="280" y1="56" x2="620" y2="56" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1" stroke-linecap="round"/>
</svg>